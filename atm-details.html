<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATM Details | ATM Pulse Cloud</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --primary: #176b63;
            --primary-dark: #0e514b;
            --cream: #f7f3eb;
            --white: #ffffff;
            --dark: #17332f;
            --muted: #71817e;
            --border: #e1e8e5;
            --light-green: #eaf5f2;
            --danger: #d9534f;
            --warning: #d99a27;
            --shadow: 0 15px 40px rgba(23,51,47,0.09);

        }


        body {

            font-family: "DM Sans", sans-serif;

            background: #f6f8f7;

            color: var(--dark);

            min-height: 100vh;

        }


        /* HEADER */

        header {

            height: 76px;

            background: white;

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 5%;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-icon {

            width: 44px;

            height: 44px;

            background: var(--primary);

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

        }


        .brand h1 {

            font-family: "Playfair Display", serif;

            font-size: 21px;

        }


        .brand p {

            color: var(--muted);

            font-size: 11px;

        }


        .back-btn {

            border: none;

            background: var(--light-green);

            color: var(--primary);

            padding: 11px 16px;

            border-radius: 10px;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

        }


        .back-btn:hover {

            background: var(--primary);

            color: white;

        }


        /* HERO */

        .hero {

            background:
                linear-gradient(
                    120deg,
                    #176b63,
                    #0e514b
                );

            color: white;

            padding: 45px 5% 80px;

        }


        .hero-content {

            max-width: 1100px;

            margin: auto;

        }


        .tag {

            display: inline-block;

            padding: 7px 13px;

            border-radius: 30px;

            background: rgba(255,255,255,0.14);

            font-size: 11px;

            margin-bottom: 14px;

        }


        .hero h2 {

            font-family: "Playfair Display", serif;

            font-size: clamp(30px,4vw,45px);

            margin-bottom: 8px;

        }


        .hero p {

            color: rgba(255,255,255,0.8);

            font-size: 14px;

        }


        /* MAIN */

        .main {

            max-width: 1100px;

            margin: -45px auto 60px;

            padding: 0 5%;

            position: relative;

        }


        /* ATM HEADER CARD */

        .atm-header {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow: var(--shadow);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .atm-bank {

            color: var(--primary);

            font-size: 12px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        .atm-header h1 {

            font-family: "Playfair Display", serif;

            font-size: 30px;

            margin-top: 5px;

        }


        .location {

            color: var(--muted);

            font-size: 13px;

            margin-top: 7px;

        }


        .status {

            padding: 9px 14px;

            border-radius: 30px;

            font-size: 12px;

            font-weight: 800;

            white-space: nowrap;

        }


        .online {

            background: #e5f7ed;

            color: #16864c;

        }


        .offline {

            background: #ffebea;

            color: #c43e3a;

        }


        .maintenance {

            background: #fff4df;

            color: #a36b08;

        }


        /* GRID */

        .details-grid {

            display: grid;

            grid-template-columns: 1.2fr 0.8fr;

            gap: 20px;

        }


        /* CARDS */

        .card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 23px;

            box-shadow: 0 7px 25px rgba(23,51,47,0.04);

        }


        .card-title {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 20px;

        }


        .card-title-icon {

            width: 38px;

            height: 38px;

            background: var(--light-green);

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .card-title h2 {

            font-size: 18px;

        }


        /* MONEY */

        .money-card {

            background:
                linear-gradient(
                    135deg,
                    #176b63,
                    #0e514b
                );

            color: white;

            border: none;

        }


        .money-card .card-title-icon {

            background: rgba(255,255,255,0.15);

        }


        .money-label {

            color: rgba(255,255,255,0.7);

            font-size: 12px;

            margin-bottom: 5px;

        }


        .money {

            font-size: 38px;

            font-weight: 800;

            letter-spacing: -1px;

        }


        .money-status {

            margin-top: 12px;

            display: inline-block;

            padding: 7px 11px;

            border-radius: 20px;

            background: rgba(255,255,255,0.14);

            font-size: 11px;

        }


        /* INFO */

        .info-grid {

            display: grid;

            grid-template-columns: repeat(2,1fr);

            gap: 12px;

        }


        .info-box {

            background: #f7f9f8;

            border-radius: 12px;

            padding: 15px;

        }


        .info-box span {

            display: block;

            color: var(--muted);

            font-size: 11px;

            margin-bottom: 6px;

        }


        .info-box strong {

            font-size: 16px;

        }


        /* SERVICES */

        .services {

            display: grid;

            grid-template-columns: repeat(2,1fr);

            gap: 10px;

        }


        .service {

            padding: 13px;

            border: 1px solid var(--border);

            border-radius: 11px;

            font-size: 12px;

            font-weight: 600;

        }


        .service.active {

            background: var(--light-green);

            color: var(--primary);

            border-color: #c6ddd8;

        }


        .service.inactive {

            color: #9b9f9e;

            background: #f8f8f8;

        }


        /* MAP */

        #map {

            height: 300px;

            width: 100%;

            border-radius: 14px;

        }


        /* UPDATE */

        .last-update {

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            background: var(--cream);

            color: var(--muted);

            font-size: 12px;

        }


        /* ACTIONS */

        .actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        .action-btn {

            flex: 1;

            padding: 13px;

            border-radius: 11px;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

            border: 1px solid var(--border);

            background: white;

            color: var(--primary);

        }


        .action-btn.primary {

            background: var(--primary);

            color: white;

            border-color: var(--primary);

        }


        .action-btn:hover {

            opacity: 0.9;

        }


        /* NOT FOUND */

        .not-found {

            background: white;

            border-radius: 20px;

            padding: 70px 20px;

            text-align: center;

            box-shadow: var(--shadow);

        }


        .not-found-icon {

            font-size: 55px;

            margin-bottom: 15px;

        }


        .not-found p {

            color: var(--muted);

            margin-top: 8px;

        }


        /* FOOTER */

        footer {

            background: #17332f;

            color: white;

            text-align: center;

            padding: 30px 5%;

        }


        footer h3 {

            font-family: "Playfair Display", serif;

        }


        footer p {

            color: rgba(255,255,255,0.6);

            font-size: 12px;

            margin-top: 5px;

        }


        /* RESPONSIVE */

        @media(max-width:800px) {

            .details-grid {

                grid-template-columns: 1fr;

            }

            .atm-header {

                align-items: flex-start;

                flex-direction: column;

            }

        }


        @media(max-width:550px) {

            header {

                height: auto;

                padding: 12px 5%;

            }

            .brand h1 {

                font-size: 17px;

            }

            .brand p {

                display: none;

            }

            .atm-header h1 {

                font-size: 25px;

            }

            .info-grid {

                grid-template-columns: 1fr 1fr;

            }

            .actions {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="brand">

        <div class="brand-icon">
            🏧
        </div>

        <div>

            <h1>
                ATM Pulse Cloud
            </h1>

            <p>
                Real-Time ATM Availability
            </p>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Dashboard
    </button>

</header>


<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <span class="tag">
            🏧 ATM INFORMATION
        </span>

        <h2 id="heroTitle">
            ATM Details
        </h2>

        <p>
            Complete availability and service information
            for the selected ATM.
        </p>

    </div>

</section>


<!-- MAIN -->

<main class="main" id="mainContent">

    <!-- CONTENT WILL BE INSERTED BY JAVASCRIPT -->

</main>


<!-- FOOTER -->

<footer>

    <h3>
        ATM Pulse Cloud
    </h3>

    <p>
        Real-Time ATM Availability and Status Monitoring System
    </p>

</footer>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


    /* =========================================
       GET SELECTED ATM
    ========================================= */

    const storedATM =
        localStorage.getItem("selectedATM");


    const mainContent =
        document.getElementById("mainContent");


    if (!storedATM) {

        mainContent.innerHTML = `

            <div class="not-found">

                <div class="not-found-icon">
                    🏧
                </div>

                <h2>
                    No ATM Selected
                </h2>

                <p>
                    Please select an ATM from the dashboard
                    to view its details.
                </p>

                <div class="actions">

                    <button
                        class="action-btn primary"
                        onclick="goBack()"
                    >
                        ← Back to Dashboard
                    </button>

                </div>

            </div>

        `;

    }

    else {

        const atm =
            JSON.parse(storedATM);


        /* =========================================
           STATUS CLASS
        ========================================= */

        let statusClass =
            "maintenance";


        if (atm.status === "Online") {

            statusClass =
                "online";

        }

        else if (atm.status === "Offline") {

            statusClass =
                "offline";

        }


        /* =========================================
           CASH AMOUNT
        ========================================= */

        let cashAmount =
            atm.cashAmount;


        if (
            cashAmount === undefined ||
            cashAmount === null
        ) {

            /*
               Demo amount based on
               cash status.
            */

            if (
                atm.cashStatus === "Available"
            ) {

                cashAmount =
                    "₹85,000";

            }

            else if (
                atm.cashStatus === "Low"
            ) {

                cashAmount =
                    "₹18,000";

            }

            else {

                cashAmount =
                    "₹0";

            }

        }


        /* =========================================
           SERVICES
        ========================================= */

        const services = [

            {
                name: "Cash Withdrawal",
                active: atm.status !== "Offline"
            },

            {
                name: "Cash Deposit",
                active: atm.status === "Online"
            },

            {
                name: "Balance Enquiry",
                active: atm.status !== "Offline"
            },

            {
                name: "Mini Statement",
                active: atm.status !== "Offline"
            },

            {
                name: "PIN Change",
                active: atm.status !== "Offline"
            },

            {
                name: "Fund Transfer",
                active: atm.status === "Online"
            }

        ];


        mainContent.innerHTML = `

            <!-- ATM HEADER -->

            <div class="atm-header">

                <div>

                    <div class="atm-bank">
                        ${atm.bank || "BANK"}
                    </div>

                    <h1>
                        ${atm.name || "ATM Terminal"}
                    </h1>

                    <div class="location">
                        📍
                        ${atm.location || "Location unavailable"}
                    </div>

                </div>


                <span class="status ${statusClass}">

                    ${
                        atm.status ||
                        "Unknown"
                    }

                </span>

            </div>


            <!-- DETAILS GRID -->

            <div class="details-grid">


                <!-- LEFT -->

                <div>


                    <!-- CASH -->

                    <div class="card money-card">

                        <div class="card-title">

                            <div class="card-title-icon">
                                💰
                            </div>

                            <h2>
                                Cash Availability
                            </h2>

                        </div>


                        <div class="money-label">
                            Estimated cash currently available
                        </div>

                        <div class="money">
                            ${cashAmount}
                        </div>


                        <div class="money-status">

                            💵
                            ${
                                atm.cashStatus ||
                                "Unknown"
                            }

                        </div>

                    </div>


                    <!-- ATM INFORMATION -->

                    <div
                        class="card"
                        style="margin-top:20px;"
                    >

                        <div class="card-title">

                            <div class="card-title-icon">
                                📊
                            </div>

                            <h2>
                                Live ATM Information
                            </h2>

                        </div>


                        <div class="info-grid">


                            <div class="info-box">

                                <span>
                                    👥 Current Queue
                                </span>

                                <strong>
                                    ${
                                        atm.queueCount ??
                                        0
                                    }
                                    people
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    ⏱️ Estimated Waiting
                                </span>

                                <strong>
                                    ${
                                        atm.waitingTime ??
                                        0
                                    }
                                    minutes
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    🏧 ATM Status
                                </span>

                                <strong>
                                    ${
                                        atm.status ||
                                        "Unknown"
                                    }
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    💵 Cash Status
                                </span>

                                <strong>
                                    ${
                                        atm.cashStatus ||
                                        "Unknown"
                                    }
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    🏦 Bank
                                </span>

                                <strong>
                                    ${
                                        atm.bank ||
                                        "Unknown"
                                    }
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    📏 Distance
                                </span>

                                <strong>

                                    ${
                                        atm.distance !==
                                        undefined

                                        ? atm.distance.toFixed(1)
                                          + " km"

                                        : "Not calculated"
                                    }

                                </strong>

                            </div>

                        </div>


                        <div class="last-update">

                            🕐
                            Last updated:
                            ${
                                atm.lastUpdated ||
                                "Just now"
                            }

                        </div>

                    </div>


                    <!-- SERVICES -->

                    <div
                        class="card"
                        style="margin-top:20px;"
                    >

                        <div class="card-title">

                            <div class="card-title-icon">
                                ⚙️
                            </div>

                            <h2>
                                Available Services
                            </h2>

                        </div>


                        <div class="services">

                            ${
                                services.map(
                                    service => `

                                    <div class="
                                        service
                                        ${
                                            service.active
                                            ? "active"
                                            : "inactive"
                                        }
                                    ">

                                        ${
                                            service.active
                                            ? "✓"
                                            : "×"
                                        }

                                        ${service.name}

                                    </div>

                                `
                                ).join("")
                            }

                        </div>

                    </div>

                </div>


                <!-- RIGHT -->

                <div>


                    <!-- MAP -->

                    <div class="card">

                        <div class="card-title">

                            <div class="card-title-icon">
                                📍
                            </div>

                            <h2>
                                ATM Location
                            </h2>

                        </div>


                        <div id="map"></div>


                        <div class="last-update">

                            📍
                            ${
                                atm.location ||
                                "Location unavailable"
                            }

                        </div>

                    </div>


                    <!-- QUICK ACTIONS -->

                    <div
                        class="card"
                        style="margin-top:20px;"
                    >

                        <div class="card-title">

                            <div class="card-title-icon">
                                ⚡
                            </div>

                            <h2>
                                Quick Actions
                            </h2>

                        </div>


                        <div class="actions">

                            <button
                                class="action-btn primary"
                                onclick="openMaps()"
                            >
                                🗺️ Get Directions
                            </button>

                            <button
                                class="action-btn"
                                onclick="reportATM()"
                            >
                                ⚠️ Report Issue
                            </button>

                        </div>

                    </div>


                </div>


            </div>

        `;


        /* =========================================
           MAP
        ========================================= */

        if (
            atm.latitude !== undefined &&
            atm.longitude !== undefined
        ) {

            const latitude =
                Number(atm.latitude);


            const longitude =
                Number(atm.longitude);


            const map =
                L.map("map").setView(
                    [
                        latitude,
                        longitude
                    ],
                    16
                );


            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            ).addTo(map);


            const marker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                ).addTo(map);


            marker.bindPopup(`

                <strong>
                    ${atm.name}
                </strong>

                <br>

                ${atm.location}

            `).openPopup();

        }

    }


    /* =========================================
       BACK
    ========================================= */

    function goBack() {

        window.location.href =
            "dashboard.html";

    }


    /* =========================================
       GOOGLE MAPS DIRECTIONS
    ========================================= */

    function openMaps() {

        const stored =
            localStorage.getItem(
                "selectedATM"
            );


        if (!stored) {
            return;
        }


        const atm =
            JSON.parse(stored);


        if (
            atm.latitude !== undefined &&
            atm.longitude !== undefined
        ) {

            const url =
                `https://www.google.com/maps/dir/?api=1&destination=${atm.latitude},${atm.longitude}`;


            window.open(
                url,
                "_blank"
            );

        }

        else {

            alert(
                "ATM location is unavailable."
            );

        }

    }


    /* =========================================
       REPORT
    ========================================= */

    function reportATM() {

        window.location.href =
            "report.html";

    }

</script>


</body>
</html>
